name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running check pointless: cancel it (Windows minutes count double on private repositories).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on the public repository (free minutes); the private development copy checks 3.14 only.
        python: ${{ github.repository == 'pironjulien/NexusAndroid' && fromJSON('["3.12", "3.13", "3.14"]') || fromJSON('["3.14"]') }}
    name: test (Python ${{ matrix.python }})
    env:
      PYTHON_VERSION: ${{ matrix.python }}  # through the environment: the matrix is computed, never expanded in a script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Prepare Python and the locked dependency cache (network allowed)
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP 'nexus-android-prepare'
          uv sync --frozen --python $env:PYTHON_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: test.ps1 (ruff, pyright, unit tests; no phone needed)
        shell: pwsh
        run: ./test.ps1 -Python $env:PYTHON_VERSION

  startup-linux:
    # What MCP directories (Glama) check in a Linux container: the server starts and lists its tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: initialize + tools/list over stdio
        run: |
          uv sync --frozen --quiet
          uv run --frozen pytest -q tests/test_startup.py
