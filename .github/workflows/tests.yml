name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: test.ps1 (ruff, pyright, unit tests; no phone needed)
        shell: pwsh
        run: ./test.ps1
