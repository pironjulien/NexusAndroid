# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main runs test.ps1 and builds the native engine for Windows x64 and Arm64
#   (self-contained single file, no .NET to install): NexusAndroid-win-x64.zip, NexusAndroid-win-arm64.zip, the Claude
#   Desktop extensions nexus-android.mcpb (x64) and nexus-android-arm64.mcpb, get.ps1 and SHA256SUMS.txt.
#   product-dev-release attests them and publishes the pre-release vX.Y.Z-dev.N (NexusSystem's development channel).
# - Stable: right after that build when its version is not released yet, or "Run workflow" (promote: a vX.Y.Z-dev.N,
#   or empty for the newest), product-promote runs: the SAME files
#   become the release vX.Y.Z with the CHANGELOG section, then server.json goes to the official MCP registry.
#   registry: only re-send a stable release's server.json. get.ps1 installs from releases/latest.
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''
      registry:
        description: Only send this stable release's server.json (vX.Y.Z) to the MCP registry again
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content native/NexusAndroid.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "native/NexusAndroid.csproj: no X.Y.Z version ($version)." }
          $found = [ordered]@{
            'native/Program.cs' = [regex]::Match((Get-Content native/Program.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
            'mcpb/manifest.json' = (Get-Content mcpb/manifest.json -Raw | ConvertFrom-Json).version
            'plugin/plugin.json' = (Get-Content plugin/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.claude-plugin/plugin.json' = (Get-Content plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.codex-plugin/plugin.json' = (Get-Content plugin/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'server.json' = (Get-Content server.json -Raw | ConvertFrom-Json).version
          }
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Build and pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            $out = Join-Path $env:RUNNER_TEMP "publish-$rid"
            dotnet publish native/NexusAndroid.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -o $out
            if ($LASTEXITCODE) { throw "dotnet publish $rid failed." }
            if (-not (Test-Path "$out/NexusAndroid.exe") -or -not (Test-Path "$out/plugin/skills/nexus-android/SKILL.md")) { throw "$rid output incomplete." }
            Copy-Item LICENSE, README.md $out
            Get-ChildItem $out -Filter *.pdb | Remove-Item
            Compress-Archive -Path "$out/*" -DestinationPath "dist/NexusAndroid-$rid.zip"
          }
          & "$env:RUNNER_TEMP/publish-win-x64/NexusAndroid.exe" --version
          if ($LASTEXITCODE) { throw 'The x64 build does not start.' }
          # Claude Desktop extensions, one per architecture: nexus-android.mcpb (x64, also the MCP registry package) and
          # nexus-android-arm64.mcpb (native Arm64).
          foreach ($pair in @(@('win-x64', 'nexus-android.mcpb'), @('win-arm64', 'nexus-android-arm64.mcpb'))) {
            $mcpb = Join-Path $env:RUNNER_TEMP "mcpb-$($pair[0])"
            New-Item -ItemType Directory "$mcpb/server" -Force | Out-Null
            Copy-Item mcpb/manifest.json, mcpb/icon.png, LICENSE $mcpb
            Copy-Item "$env:RUNNER_TEMP/publish-$($pair[0])/NexusAndroid.exe" "$mcpb/server/"
            npx --yes @anthropic-ai/mcpb@2.1.2 pack $mcpb "dist/$($pair[1])"
            if ($LASTEXITCODE) { throw "mcpb pack failed ($($pair[1]))." }
          }
          Copy-Item get.ps1 dist  # the installer too, checked and attested like the packages
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusAndroid
      version: ${{ needs.build.outputs.version }}

  promote:
    # Right after the push that built a new version (same files), or by hand ("Run workflow").
    needs: dev
    if: always() && (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusAndroid
      promote: ${{ inputs.promote || needs.dev.outputs.tag }}
      registry-only: ${{ inputs.registry }}
      mcp-package: nexus-android.mcpb
